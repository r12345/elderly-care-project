            <div class="nav-item" data-page="dict" data-url="#"><i class="fas fa-book"></i>数据字典</div>

</div>

<script>
    const menuItems = document.querySelectorAll('.nav-item[data-page]');

    menuItems.forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();

            const pageId = this.getAttribute('data-page');
            const url = this.getAttribute('data-url');

            menuItems.forEach(m => m.classList.remove('active'));
            this.classList.add('active');

            if (url && url !== '#') {
                window.parent.postMessage({
                    type: 'navigate',
                    page: url
                }, '*');
            }
        });
    });

    const defaultActive = document.querySelector('.nav-item[data-page="dashboard"]');
    if (defaultActive) {
        defaultActive.classList.add('active');
    }
    // 初始化：所有二级菜单默认收起，图标朝下
    document.querySelectorAll('.sub-nav').forEach(sub => {
        sub.style.display = 'none';
    });

    // 初始化所有一级菜单的箭头朝下
    document.querySelectorAll('.nav-section > .nav-item .fa-chevron-down').forEach(arrow => {
        arrow.style.transform = 'rotate(0deg)';
    });

    // 获取所有一级菜单项（带有子菜单的）
    const parentMenuItems = document.querySelectorAll('.nav-section > .nav-item[data-page]');

    // 为每个一级菜单添加点击事件
    parentMenuItems.forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();

            // 获取当前菜单项所在的nav-section
            const section = this.closest('.nav-section');
            // 获取该section下的二级菜单容器
            const subNav = section.querySelector('.sub-nav');
            // 获取箭头图标
            const arrowIcon = this.querySelector('.fa-chevron-down');

            // 如果存在二级菜单
            if (subNav) {
                // 切换二级菜单的显示状态
                if (subNav.style.display === 'none') {
                    subNav.style.display = 'block';
                    if (arrowIcon) arrowIcon.style.transform = 'rotate(180deg)';
                } else {
                    subNav.style.display = 'none';
                    if (arrowIcon) arrowIcon.style.transform = 'rotate(0deg)';
                }
            }

            // 处理菜单激活状态和页面跳转
            const pageId = this.getAttribute('data-page');
            const url = this.getAttribute('data-url');

            // 更新激活状态
            document.querySelectorAll('.nav-item').forEach(m => m.classList.remove('active'));
            this.classList.add('active');

            if (url && url !== '#') {
                window.parent.postMessage({
                    type: 'navigate',
                    page: url
                }, '*');
            }
        });
    });

    // 为二级菜单项添加点击事件
    const subMenuItems = document.querySelectorAll('.sub-nav .nav-item');
    subMenuItems.forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();

            const pageId = this.getAttribute('data-page');
            const url = this.getAttribute('data-url');

            document.querySelectorAll('.nav-item').forEach(m => m.classList.remove('active'));
            this.classList.add('active');

            const parentSection = this.closest('.nav-section');
            if (parentSection) {
                const parentMenuItem = parentSection.querySelector('> .nav-item');
                if (parentMenuItem) {
                    parentMenuItem.classList.add('active');
                }
            }

            if (url && url !== '#') {
                window.parent.postMessage({
                    type: 'navigate',
                    page: url
                }, '*');
            }
        });
    });

    // 监听页面加载消息
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'pageLoaded') {
            const currentPage = event.data.page;

            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.getAttribute('data-page') === currentPage) {
                    document.querySelectorAll('.nav-item').forEach(m => m.classList.remove('active'));
                    item.classList.add('active');

                    if (item.closest('.sub-nav')) {
                        const parentSection = item.closest('.nav-section');
                        if (parentSection) {
                            const subNav = parentSection.querySelector('.sub-nav');
                            const arrowIcon = parentSection.querySelector('> .nav-item .fa-chevron-down');
                            if (subNav) {
                                subNav.style.display = 'block';
                                if (arrowIcon) arrowIcon.style.transform = 'rotate(180deg)';
                            }
                            const parentMenuItem = parentSection.querySelector('> .nav-item');
                            if (parentMenuItem) {
                                parentMenuItem.classList.add('active');
                            }
                        }
                    } else {
                        const section = item.closest('.nav-section');
                        if (section) {
                            const subNav = section.querySelector('.sub-nav');
                            const arrowIcon = section.querySelector('> .nav-item .fa-chevron-down');
                            if (subNav && subNav.style.display === 'none') {
                                subNav.style.display = 'block';
                                if (arrowIcon) arrowIcon.style.transform = 'rotate(180deg)';
                            }
                        }
                    }
                }
            });
        }
    });
</script>
</body>
